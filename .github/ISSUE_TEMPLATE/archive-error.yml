name: Archive error
description: Report a broken link, typo, rendering defect, metadata problem, citation error, or archive inconsistency.
title: "[Archive error]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for archive and presentation defects. If the correction would undermine a substantive technical claim or OP4d, use the OP4d counterexample form instead.

  - type: input
    id: location
    attributes:
      label: Page, file, or URL
      placeholder: https://alignmentconstraint.org/... or repository/path.md
    validations:
      required: true

  - type: dropdown
    id: error_type
    attributes:
      label: Error type
      options:
        - Broken link or missing file
        - Rendering or formatting
        - Typo or wording defect
        - Metadata / canonical / structured data
        - Citation or reference
        - Machine-readable inconsistency
        - Version / proof-status inconsistency
        - Other
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: What is wrong?
      description: State what you observed as specifically as possible.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected correction
      description: What should the page/file say or do instead?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence or source
      description: Add screenshots, source links, citations, or cross-file references when useful.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: To the best of my knowledge, this is an archive/correction issue rather than a proposed substantive OP4d counterexample.
          required: true
